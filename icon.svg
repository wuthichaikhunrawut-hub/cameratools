<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />
  <!-- Camera Body -->
  <rect x="76" y="146" width="360" height="260" rx="42" fill="#1e293b" stroke="#334155" stroke-width="12" />
  <!-- Camera Top Bump / Pentaprism -->
  <path d="M176 146 L216 96 L296 96 L336 146 Z" fill="#1e293b" stroke="#334155" stroke-width="12" stroke-linejoin="round" />
  <!-- Red Recording / Indicator Dot -->
  <circle cx="130" cy="200" r="14" fill="#ef4444" />
  <!-- Outer Lens Ring (Stabilizer Gimbal Gyro Ring) -->
  <circle cx="256" cy="276" r="88" fill="none" stroke="url(#lensGrad)" stroke-width="14" stroke-dasharray="14 10" />
  <!-- Inner Lens Glass -->
  <circle cx="256" cy="276" r="62" fill="#0f172a" stroke="#10b981" stroke-width="6" />
  <!-- Lens Core Iris -->
  <circle cx="256" cy="276" r="28" fill="url(#lensGrad)" />
  <!-- Lens Reflection Flare -->
  <path d="M236 246 A 35 35 0 0 1 276 246" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.75" />
</svg>