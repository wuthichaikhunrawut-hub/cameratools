<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#090a0f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>UltraSteady Pro Cam — Vivo Y21T Edition</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Hidden SVG GPU Convolution Filter for Real-time Hardware Sharpening -->
  <svg width="0" height="0" style="position:absolute; pointer-events:none;">
    <defs>
      <filter id="gpuSharpen" color-interpolation-filters="sRGB">
        <feConvolveMatrix
          id="sharpenMatrix"
          order="3 3"
          preserveAlpha="true"
          kernelMatrix="0 0 0 0 1 0 0 0 0"
          divisor="1"
          bias="0"
        />
      </filter>
    </defs>
  </svg>

  <!-- Hidden raw video element fed by camera -->
  <video id="rawVideo" autoplay playsinline muted style="display:none;"></video>

  <!-- Main Viewport -->
  <div class="app-container">
    <!-- Top HUD Status Bar -->
    <header class="top-hud">
      <div class="hud-left">
        <span class="badge badge-steady" id="hudModeBadge">SUPER ULTRA</span>
        <span class="badge badge-res" id="hudResBadge">1080p HD</span>
        <span class="badge badge-fps" id="hudFpsBadge">60 FPS</span>
      </div>
      <div class="hud-right">
        <button class="icon-btn" id="btnCompare" title="เทียบภาพต้นฉบับ">
          <span>PIP เทียบสั่น</span>
        </button>
        <button class="icon-btn" id="btnTorch" title="ไฟฉาย LED">
          <span>🔦</span>
        </button>
        <button class="icon-btn" id="btnSwitchCam" title="สลับกล้อง">
          <span>🔄</span>
        </button>
      </div>
    </header>

    <!-- Horizon Level & Shake Telemetry Bar -->
    <div class="telemetry-bar">
      <div class="telemetry-item">
        <span class="label">กันสั่นทำงาน:</span>
        <div class="meter-track">
          <div class="meter-fill" id="shakeMeterFill"></div>
        </div>
        <span class="val" id="shakePxText">0 px</span>
      </div>
      <div class="telemetry-item">
        <span class="label">ระดับน้ำ:</span>
        <span class="val" id="rollAngleText">0.0°</span>
      </div>
    </div>

    <!-- Main Stabilized Canvas Viewport -->
    <main class="viewport-wrap" id="viewportWrap">
      <canvas id="steadyCanvas"></canvas>

      <!-- Horizon Lock Guide Line -->
      <div class="horizon-guide" id="horizonGuide">
        <div class="horizon-line"></div>
        <div class="horizon-center-dot"></div>
      </div>

      <!-- Optional Raw Unstabilized PIP for live comparison -->
      <div class="pip-raw-box hidden" id="pipRawBox">
        <span class="pip-label">ภาพดิบ (ยังไม่กันสั่น)</span>
        <canvas id="rawPreviewCanvas" width="180" height="320"></canvas>
      </div>

      <!-- Recording Timer Overlay -->
      <div class="rec-indicator hidden" id="recIndicator">
        <span class="rec-dot"></span>
        <span id="recTimerText">00:00</span>
      </div>
    </main>

    <!-- Quick Mode Selector Pills -->
    <div class="preset-bar">
      <button class="preset-pill" data-preset="standard">ปกติ (15%)</button>
      <button class="preset-pill active" data-preset="ultra">Ultra Steady (28%)</button>
      <button class="preset-pill" data-preset="gimbal">Gimbal Lock (38%)</button>
      <button class="preset-pill" data-preset="off">ปิดกันสั่น</button>
    </div>

    <!-- Expandable Drawer for Tuning Stabilization & Sharpness -->
    <section class="tuning-panel" id="tuningPanel">
      <div class="panel-tabs">
        <button class="tab-btn active" data-tab="tab-steady">🛡️ ตั้งค่ากันสั่น</button>
        <button class="tab-btn" data-tab="tab-clarity">✨ ความคมชัด & HD</button>
      </div>

      <!-- Tab 1: Stabilization Controls -->
      <div class="tab-content active" id="tab-steady">
        <div class="control-row">
          <label>ความหน่วงความนิ่ง (Smoothness)</label>
          <input type="range" id="sliderSmooth" min="50" max="97" value="88" />
          <span class="ctrl-val" id="valSmooth">88%</span>
        </div>
        <div class="control-row">
          <label>ระยะเผื่อขอบกันสั่น (Crop Margin)</label>
          <input type="range" id="sliderCrop" min="5" max="42" value="28" />
          <span class="ctrl-val" id="valCrop">28%</span>
        </div>
        <div class="toggle-grid">
          <label class="toggle-chip">
            <input type="checkbox" id="chkOpticalFlow" checked />
            <span>👁️ วิเคราะห์พิกเซลภาพ (ช่วยมือถือไม่มี Gyro)</span>
          </label>
          <label class="toggle-chip">
            <input type="checkbox" id="chkHorizonLock" checked />
            <span>📐 ล็อกเส้นขอบฟ้า (Horizon Lock)</span>
          </label>
        </div>
      </div>

      <!-- Tab 2: Clarity, Sharpness & Resolution Controls -->
      <div class="tab-content" id="tab-clarity">
        <div class="control-row">
          <label>ดึงความคมชัด (GPU Super Sharpness)</label>
          <input type="range" id="sliderSharpness" min="0" max="100" value="45" />
          <span class="ctrl-val" id="valSharpness">45%</span>
        </div>
        <div class="control-row">
          <label>เพิ่มมิติความใส (Clarity & Contrast)</label>
          <input type="range" id="sliderClarity" min="0" max="60" value="18" />
          <span class="ctrl-val" id="valClarity">18%</span>
        </div>
        <div class="control-row">
          <label>ความละเอียดเซ็นเซอร์</label>
          <select id="selectRes" class="ctrl-select">
            <option value="720" selected>HD 720p (ลื่นไหล แนะนำสำหรับ Y21T)</option>
            <option value="1080">Full HD 1080p</option>
          </select>
        </div>
        <div class="control-row">
          <label>บิตเรตวิดีโอ (ความชัดไฟล์)</label>
          <select id="selectBitrate" class="ctrl-select">
            <option value="5000000">5 Mbps (เบาเครื่อง)</option>
            <option value="8000000" selected>8 Mbps (ลื่นไหล คมชัด)</option>
            <option value="14000000">14 Mbps (High Bitrate)</option>
          </select>
        </div>
        <div class="toggle-grid">
          <label class="toggle-chip">
            <input type="checkbox" id="chkAntiBlur" checked />
            <span>⚡ ลดแสงนิดหน่อยเพื่อเร่งสปีดชัตเตอร์ (ลดภาพเบลอเวลาสั่น)</span>
          </label>
        </div>
      </div>
    </section>

    <!-- Bottom Shutter & Action Bar -->
    <footer class="bottom-bar">
      <button class="action-btn secondary" id="btnSnapPhoto" title="ถ่ายภาพนิ่งคมชัดสูง">
        📸 ถ่ายภาพนิ่ง
      </button>

      <button class="shutter-btn" id="btnRecord" aria-label="เริ่มหรือหยุดอัดวิดีโอ">
        <div class="shutter-inner" id="shutterInner"></div>
      </button>

      <button class="action-btn secondary" id="btnRecenter" title="รีเซ็ตจุดศูนย์กลางกล้อง">
        🎯 รีเซ็ตศูนย์
      </button>
    </footer>

    <!-- Toast Notification & Download Modal -->
    <div class="toast hidden" id="toastMsg"></div>

    <!-- Video Saved / Download Dialog Modal -->
    <div class="save-modal-overlay hidden" id="saveModal">
      <div class="save-modal-card">
        <h3>🎬 บันทึกคลิปเรียบร้อย!</h3>
        <p class="modal-sub">ดูคลิปตัวอย่างและกดยืนยันบันทึกลงมือถือ</p>
        <div class="modal-video-wrap">
          <video id="modalPreviewVideo" controls playsinline></video>
        </div>
        <div class="modal-actions">
          <a id="btnDownloadFile" class="modal-btn primary" download="UltraSteady_Video.webm">
            ⬇️ บันทึกลงเครื่อง (Save to Device)
          </a>
          <button class="modal-btn secondary" id="btnCloseModal">
            ✖️ ปิดหน้าต่าง
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
