<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>UltraSteady Camera</title>
  <link rel="icon" type="image/svg+xml" href="icon.svg" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Hidden raw video element fed by camera -->
  <video id="rawVideo" autoplay playsinline muted style="display:none;"></video>

  <!-- Fullscreen Camera Viewport -->
  <div class="camera-root" id="cameraRoot">
    <!-- Main Fullscreen Stabilized Canvas -->
    <canvas id="steadyCanvas"></canvas>

    <!-- Tap to Focus Reticle Box -->
    <div class="focus-box hidden" id="focusBox"></div>

    <!-- Tap to Start Camera Overlay -->
    <div class="permission-overlay" id="permissionOverlay">
      <div class="permission-card">
        <div class="perm-icon">📷</div>
        <h2>UltraSteady Cam</h2>
        <p>แตะปุ่มด้านล่างเพื่ออนุญาตการใช้งานกล้องและเซนเซอร์กันสั่น</p>
        <button class="perm-btn" id="btnStartCamera" onclick="startCamera()">
          เปิดใช้งานกล้อง (Start Camera)
        </button>
        <div id="permErrorMsg" style="color: #ef4444; font-size: 11px; margin-top: 6px; display: none;"></div>
      </div>
    </div>

    <!-- Subtle Horizon Guide Line -->
    <div class="horizon-guide" id="horizonGuide">
      <div class="horizon-line"></div>
    </div>

    <!-- Minimal Top Controls Overlay -->
    <header class="camera-top-overlay">
      <div class="top-left-status">
        <span class="mode-tag" id="hudModeBadge">ULTRA STEADY</span>
      </div>
      <div class="top-right-actions">
        <button class="glass-icon-btn" id="btnTorch" title="ไฟฉาย">🔦</button>
        <button class="glass-icon-btn" id="btnSwitchCam" title="สลับกล้อง">🔄</button>
        <button class="glass-icon-btn" id="btnOpenSettings" title="ตั้งค่า">⚙️</button>
      </div>
    </header>

    <!-- Recording Indicator -->
    <div class="rec-pill hidden" id="recIndicator">
      <span class="rec-blink"></span>
      <span id="recTimerText">00:00</span>
    </div>

    <!-- Clean Floating Zoom Pills -->
    <div class="camera-zoom-bar">
      <button class="zoom-chip active" data-zoom="1.0">1x</button>
      <button class="zoom-chip" data-zoom="2.0">2x</button>
      <button class="zoom-chip" data-zoom="3.0">3x</button>
    </div>

    <!-- Clean Native Bottom Controls -->
    <footer class="camera-bottom-overlay">
      <button class="sub-action-btn" id="btnSnapPhoto" title="ถ่ายภาพนิ่ง">
        📸
      </button>

      <button class="main-shutter-btn" id="btnRecord" aria-label="ถ่ายวิดีโอ">
        <div class="shutter-core" id="shutterInner"></div>
      </button>

      <button class="sub-action-btn" id="btnRecenter" title="รีเซ็ตระนาบ">
        🎯
      </button>
    </footer>

    <!-- Clean Settings Modal (Only opens when gear icon is clicked) -->
    <div class="settings-modal-overlay hidden" id="settingsModal">
      <div class="settings-modal-sheet">
        <div class="settings-header">
          <h3>⚙️ ตั้งค่ากล้องกันสั่น</h3>
          <button class="close-btn" id="btnCloseSettings">✕</button>
        </div>

        <div class="settings-body">
          <div class="setting-item">
            <label>โหมดกันสั่น</label>
            <div class="mode-select-grid">
              <button class="mode-btn" data-preset="standard">ปกติ (12%)</button>
              <button class="mode-btn active" data-preset="ultra">Ultra (22%)</button>
              <button class="mode-btn" data-preset="gimbal">Gimbal (32%)</button>
              <button class="mode-btn" data-preset="off">ปิดกันสั่น</button>
            </div>
          </div>

          <div class="setting-item">
            <label>ความนิ่ง (Smoothness): <b id="valSmooth">72%</b></label>
            <input type="range" id="sliderSmooth" min="40" max="95" value="72" />
          </div>

          <div class="setting-item">
            <label class="check-label">
              <input type="checkbox" id="chkHorizonLock" checked />
              <span>📐 ล็อกเส้นขอบฟ้าอัตโนมัติ (Horizon Lock)</span>
            </label>
          </div>

          <div class="setting-item">
            <label>ความละเอียดกล้อง</label>
            <select id="selectRes" class="setting-select">
              <option value="720" selected>HD 720p (ลื่นไหล แนะนำ Vivo Y21T)</option>
              <option value="1080">Full HD 1080p</option>
            </select>
          </div>
        </div>
      </div>
    </div>

    <!-- Save Video Modal -->
    <div class="save-modal-overlay hidden" id="saveModal">
      <div class="save-modal-card">
        <h3>🎬 ถ่ายเสร็จเรียบร้อย!</h3>
        <div class="modal-video-wrap">
          <video id="modalPreviewVideo" controls playsinline></video>
        </div>
        <div class="modal-actions">
          <a id="btnDownloadFile" class="modal-btn primary" download="UltraSteady_Video.webm">
            ⬇️ บันทึกลงเครื่อง
          </a>
          <button class="modal-btn secondary" id="btnCloseModal">
            ✕ ปิด
          </button>
        </div>
      </div>
    </div>

    <!-- Toast Notification -->
    <div class="toast hidden" id="toastMsg"></div>
  </div>

  <script src="app.js?v=2.1"></script>
</body>
</html>
